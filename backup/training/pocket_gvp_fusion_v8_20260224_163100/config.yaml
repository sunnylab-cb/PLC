data:
  data_root: data
  distances_file: data/residue_ligand_distances_vdw.pt
  distances_file_original: data/residue_ligand_distances_poc_style.pt
  ligand_features_dir: ligand_features_v4
  max_atoms: 100
  max_seq_len: 1500
  protein_features_dir: complete_features_v3
  split_file: configs/splits/mmseqs_splits_strict.csv
  test_ratio: 0.1
  train_ratio: 0.8
  val_ratio: 0.1
experiment:
  name: pocket_gvp_fusion_v8
  output_dir: outputs
  seed: 42
logging:
  log_every: 10
  tensorboard: true
  tensorboard_dir: runs
  wandb: false
model:
  d_esm: 1280
  d_gvp_internal: 256
  d_ligand_atom: 96
  d_model: 512
  d_phys: 62
  d_phys_encoded: 128
  d_spatial_scalar: 72
  dropout: 0.1
  edge_dim: 6
  esm_dropout_prob: 0.1
  gvp_k_neighbors: 20
  gvp_radius: 10.0
  n_classes: 3
  n_cross_attention_layers: 4
  n_gvp_layers: 3
  n_gvp_vector_hidden: 20
  n_gvp_vectors: 10
  n_heads: 8
  n_ligand_layers: 3
  n_transformer_layers: 4
  physchem_dropout_prob: 0.2
  use_gated_attn: true
  use_gradient_checkpointing: false
  use_swiglu: true
training:
  batch_size: 24
  betas:
  - 0.9
  - 0.999
  class_weights:
  - 7.0
  - 1.0
  - 2.2
  dice_weight: 0.5
  early_stopping_patience: 30
  focal_gamma: 2.0
  focal_weight: 0.5
  gradient_clip: 1.0
  learning_rate: 0.0001
  loss_type: focal
  min_lr: 1.0e-06
  num_epochs: 100
  num_workers: 24
  optimizer: adamw
  save_every: 5
  scheduler: cosine
  use_amp: false
  warmup_epochs: 5
  weight_decay: 0.01
