data:
  data_root: data
  distances_file: data/residue_ligand_distances_dcenter.pt
  label_contact_thresh: 5.0
  label_near_thresh: 8.0
  ligand_features_dir: ligand_features_v5
  max_atoms: 128
  max_seq_len: 1800
  nma_features_dir: complete_features_v4_nma
  nma_max_conf: 9
  nma_n_confs: 3
  protein_features_dir: complete_features_v4
  split_file: configs/splits/splits.txt
  test_ratio: 0.1
  train_ratio: 0.8
  val_ratio: 0.1
experiment:
  name: pocket_gvp_fusion_v10m4
  output_dir: outputs
  seed: 42
logging:
  log_every: 10
  tensorboard: true
  tensorboard_dir: runs
  wandb: false
model:
  attn_dropout: 0.15
  classifier_dropout: 0.2
  coord_noise_std: 0.5
  d_esm: 1280
  d_gvp_internal: 256
  d_ligand_atom: 109
  d_model: 512
  d_phys: 62
  d_phys_encoded: 128
  d_spatial_scalar: 89
  dist_bias_max_dist: 20.0
  dist_bias_n_rbf: 16
  dropout: 0.15
  edge_dim: 6
  esm_dropout_prob: 0.15
  gvp_dropout_prob: 0.15
  gvp_edge_rbf_bins: 16
  gvp_edge_rbf_dmax: 20.0
  gvp_k_neighbors: 20
  gvp_radius: 10.0
  ligand_edge_rbf_bins: 8
  n_classes: 3
  n_cross_attention_layers: 4
  n_gvp_layers: 3
  n_gvp_vector_hidden: 20
  n_gvp_vectors: 12
  n_heads: 8
  n_ligand_layers: 3
  n_transformer_layers: 4
  physchem_dropout_prob: 0.2
  stochastic_depth_prob: 0.15
  use_dist_bias: true
  use_flash_attn: false
  use_gated_attn: true
  use_gradient_checkpointing: false
  use_swiglu: true
training:
  accumulation_steps: 1
  batch_size: 18
  betas:
  - 0.9
  - 0.999
  boundary_distance_threshold: 8.0
  boundary_multiplier: 2.0
  boundary_weight: 0.2
  class_weights:
  - 8.0
  - 3.0
  - 1.0
  cudnn_benchmark: false
  dice_weight: 0.0
  early_stopping_patience: 30
  enable_profiling: false
  focal_gamma: 2.5
  focal_weight: 0.7
  gradient_clip: 1.0
  iou_component_weight: 1.0
  iou_d_max: 10.0
  iou_dist_weight: 0.2
  iou_power: 1.5
  iou_weight: 0.0
  label_smoothing: 0.05
  learning_rate: 5.0e-05
  min_lr: 1.0e-06
  num_epochs: 100
  num_workers: 8
  optimizer: adamw
  pin_memory: true
  prefetch_factor: 2
  save_every: 5
  scheduler: cosine
  tversky_alpha: 0.3
  tversky_beta: 0.7
  tversky_smooth: 1.0
  tversky_weight: 0.3
  use_amp: false
  use_bf16: false
  use_boundary_loss: false
  warmup_epochs: 3
  weight_decay: 0.05
  weighted_dice_smooth: 1.0
  weighted_dice_weight: 0.0
