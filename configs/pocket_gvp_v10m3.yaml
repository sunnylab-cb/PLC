# Pocket-GVP-Fusion V10m3 Configuration
# V10m3 vs V10m2: switches from VDW distance labels to d_min labels
# Label scheme: Contact < 5.0Å, Near 5.0-8.0Å, Far > 8.0Å
#               (d_min: minimum heavy-atom pairwise distance, residue vs ligand)
#               注意: distances 文件名含 "dcenter" 为历史遗留误称，实际存储的是 d_min
# Aligned with BioLiP / P2Rank / COACH mainstream benchmark standard

experiment:
  name: "pocket_gvp_fusion_v10"
  seed: 42
  output_dir: "outputs"

data:
  data_root: "data"
  ligand_features_dir: "ligand_features_v5"
  protein_features_dir: "complete_features_v4"
  nma_features_dir: "complete_features_v4_nma"
  nma_n_confs: 1
  nma_max_conf: 9
  distances_file: "data/residue_ligand_distances_dcenter.pt"  # d_min (文件名历史遗留误称)
  split_file: "configs/splits/splits.txt"
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  max_seq_len: 1500
  max_atoms: 128
  # d_min label thresholds (mainstream standard)
  label_contact_thresh: 5.0   # Contact: d_min < 5.0Å
  label_near_thresh: 8.0      # Near: 5.0–8.0Å; Far: > 8.0Å

model:
  d_esm: 1280
  d_phys: 62
  d_spatial_scalar: 89
  d_phys_encoded: 128
  d_gvp_internal: 256
  d_model: 512
  d_ligand_atom: 109
  n_gvp_vectors: 12
  n_gvp_vector_hidden: 20

  n_gvp_layers: 3
  n_transformer_layers: 4
  n_ligand_layers: 3
  n_heads: 8
  n_cross_attention_layers: 4

  dropout: 0.1
  attn_dropout: 0.1
  classifier_dropout: 0.2
  stochastic_depth_prob: 0.1

  use_flash_attn: false

  esm_dropout_prob: 0.1
  physchem_dropout_prob: 0.2

  use_gated_attn: true
  use_swiglu: true
  gvp_radius: 10.0
  gvp_k_neighbors: 20
  use_gradient_checkpointing: false

  n_classes: 3
  edge_dim: 6

training:
  batch_size: 18
  num_epochs: 100
  num_workers: 8

  optimizer: "adamw"
  learning_rate: 1.0e-4
  weight_decay: 0.05
  betas: [0.9, 0.999]

  scheduler: "cosine"
  warmup_epochs: 5
  min_lr: 1.0e-6

  loss_type: "focal"
  focal_gamma: 2.0
  # V10m3: class weights re-tuned for 5.0/8.0 thresholds
  # Contact class is now larger (5.0Å vs 3.5Å), so weight reduced
  class_weights: [7.0, 3.0, 2.0]
  dice_weight: 0.0
  focal_weight: 1.0

  iou_weight: 0.0
  iou_component_weight: 1.0
  iou_dist_weight: 0.2
  iou_power: 1.5
  iou_d_max: 10.0

  use_boundary_loss: false
  boundary_weight: 0.2
  boundary_multiplier: 2.0
  boundary_distance_threshold: 8.0

  label_smoothing: 0.15
  gradient_clip: 1.0
  enable_profiling: false

  save_every: 5
  early_stopping_patience: 30

  use_amp: false
  use_bf16: false
  accumulation_steps: 1
  cudnn_benchmark: false
  pin_memory: true
  prefetch_factor: 2

logging:
  log_every: 10
  tensorboard: true
  tensorboard_dir: "runs"
  wandb: false
